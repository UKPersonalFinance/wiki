name: Setup mise and bun
description: Install mise-managed tools and bun dependencies, with bun install caching

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
    - uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
