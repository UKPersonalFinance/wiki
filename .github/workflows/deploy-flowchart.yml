name: Deploy Flowchart

on:
  push:
    branches: [main]
    paths:
      - flowchart/**
      - wrangler.toml
      - .github/workflows/deploy-flowchart.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-flowchart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-flowchart
      cancel-in-progress: true
    environment:
      name: production
      url: https://flowchart.ukpersonal.finance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Deploy to Cloudflare Workers (flowchart)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env flowchart
