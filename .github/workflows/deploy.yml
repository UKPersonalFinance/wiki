name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA to build and deploy. Defaults to the branch this run was started from.
        required: false
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      ref: ${{ steps.release.outputs.ref }}
      should_deploy: ${{ steps.should_deploy.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          name: release-tag
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          name: dist-hash
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Resolve release tag and ref
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)-$(git rev-parse --short HEAD)"
            ref="$(git rev-parse HEAD)"
          else
            tag="$(cat release-tag.txt)"
            ref="$RUN_HEAD_SHA"
          fi
          {
            echo "tag=$tag"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
      - name: Determine whether dist changed since last release
        id: should_deploy
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hash="$(cat dist-hash.txt)"
          last_tag="$(git for-each-ref --sort=-creatordate --format='%(refname:short)' refs/tags | head -n1)"
          last_hash="$(git for-each-ref --format='%(contents)' "refs/tags/$last_tag" 2>/dev/null | sed -n 's/^dist-hash: //p')"
          echo "Current dist hash: $hash (last release $last_tag: ${last_hash:-none})"
          if [ -n "$last_hash" ] && [ "$hash" = "$last_hash" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "### Skipping production deploy — dist unchanged since $last_tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-staging:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.ukpersonal.finance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bunx astro build --mode staging
        env:
          PUBLIC_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - name: Keep staging out of search engines
        run: |
          cat >> dist/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow
          EOF
      - name: Deploy to Cloudflare Workers (staging)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging --tag ${{ needs.prepare.outputs.tag }} --message "Deployed from ${{ needs.prepare.outputs.ref }}"
      - name: Verify staging serves this release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          for attempt in $(seq 1 10); do
            body="$(curl -fsS -u "ci:flowchart" https://staging.ukpersonal.finance/ || true)"
            case "$body" in
              *"$TAG"*)
                echo "staging is serving $TAG"
                exit 0
                ;;
            esac
            echo "attempt $attempt: $TAG not live yet"
            sleep 10
          done
          echo "::error::staging did not serve $TAG within timeout"
          exit 1

  deploy-production:
    needs: [prepare, deploy-staging]
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    environment:
      name: production
      url: https://ukpersonal.finance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: bun run build
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLIC_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          name: dist-production
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Compute dist hash
        id: hash
        run: |
          cp -r dist dist-hashcheck
          find dist-hashcheck -name '*.html' -print0 |
            xargs -0 sed -i -E 's#(class="version[^"]*">Version: )[^<]*#\1#'
          hash="$(find dist-hashcheck -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          rm -rf dist-hashcheck
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Tag release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          DIST_HASH: ${{ steps.hash.outputs.hash }}
        run: |
          existing="$(git ls-remote --tags origin |
            awk -v t="refs/tags/$TAG" '$2 == t "^{}" { peeled = $1 } $2 == t { plain = $1 } END { print (peeled ? peeled : plain) }')"
          if [ -n "$existing" ]; then
            if [ "$existing" = "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG already points at this commit"
              exit 0
            fi
            echo "::error::Tag $TAG already exists on $existing, refusing to move it"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" -m "dist-hash: $DIST_HASH"
          git push origin "refs/tags/$TAG"
      - name: Deploy to Cloudflare Workers (production)
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production --tag ${{ needs.prepare.outputs.tag }} --message "Deployed from ${{ needs.prepare.outputs.ref }}"
