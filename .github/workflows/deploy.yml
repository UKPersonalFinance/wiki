name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    environment:
      name: staging
      url: https://staging.ukpersonal.finance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup
      - run: bunx astro build --mode staging
      - name: Keep staging out of search engines
        run: |
          cat >> dist/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow
          EOF
      - name: Compute release tag
        id: release
        run: echo "tag=$(date +%Y-%m-%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Workers (staging)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging --tag ${{ steps.release.outputs.tag }} --message "Deployed from ${{ github.event.workflow_run.head_sha || github.sha }}"

  deploy-production:
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    environment:
      name: production
      url: https://new.ukpersonal.finance
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/setup
      - run: bun run build
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/download-artifact@v8
        if: github.event_name != 'workflow_dispatch'
        with:
          name: dist-production
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Compute release tag
        id: release
        run: echo "tag=$(date +%Y-%m-%d)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare Workers (production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production --tag ${{ steps.release.outputs.tag }} --message "Deployed from ${{ github.event.workflow_run.head_sha || github.sha }}"
      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"
