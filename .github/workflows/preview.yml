name: Preview

on:
  pull_request:
    branches: [main]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bunx astro build --mode staging
      - name: Keep preview out of search engines
        run: |
          cat >> dist/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow
          EOF
      - name: Upload preview version
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --env staging

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          COMMAND_OUTPUT: ${{ steps.preview.outputs.command-output }}
        with:
          script: |
            const output = process.env.COMMAND_OUTPUT || '';
            const match = output.match(/https:\/\/\S+\.workers\.dev\S*/);
            const url = match ? match[0] : null;
            const body = url
              ? `Preview deployed: ${url}`
              : 'Preview build finished, but no preview URL was found — check the workflow logs.';
            const marker = '<!-- preview-url-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const commentBody = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }
