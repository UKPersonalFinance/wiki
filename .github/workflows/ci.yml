name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: bunx astro check
      - run: bun run build
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: dist-production
          path: dist
          retention-days: 1

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: prek run --all-files
