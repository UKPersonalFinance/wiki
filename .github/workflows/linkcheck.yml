name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bunx astro build
      - name: Restore lychee cache
        id: restore-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --cache --max-cache-age 1d --root-dir "$PWD/dist" dist
          fail: false
      - name: Save lychee cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .lycheecache
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
      - name: Find existing report issue
        id: existing-issue
        if: steps.lychee.outputs.exit_code != 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Link Checker Report"' --json number --jq '.[0].number')
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Create issue from report
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          issue-number: ${{ steps.existing-issue.outputs.number }}
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: automated issue
      - name: Close report issue if links are fixed
        if: steps.lychee.outputs.exit_code == 0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Link Checker Report"' --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "All links passed in the latest check."
          fi
      - name: Fail if broken links found
        if: steps.lychee.outputs.exit_code != 0
        run: exit 1
