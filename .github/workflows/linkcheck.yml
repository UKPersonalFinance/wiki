name: Link Check

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.mdx"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bunx astro build
      - run: lychee --no-progress --root-dir "$PWD/dist" dist
